[pytest]
# 命令行默认参数，每次执行pytest自动带上
addopts = -vs --alluredir=results --clean-alluredir --allure-no-capture

# 测试用例搜索目录
testpaths = testcase

# 测试类命名规则：以Test开头
python_classes = Test*

# 测试方法命名规则：以test_开头
python_functions = test_*

# 搜索文件规则：test_开头的py文件
python_files = test_*.py

# 日志配置（可选，打印日志到控制台）
log_cli = true
log_cli_level = INFO

# 【pytest-order 控制用例顺序，可选】
# order_modes = collect

#输出测试报告
# allure generate results -o report --clean